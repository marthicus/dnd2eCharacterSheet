<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local AD&D 2e Character Sheet</title>
  <link rel="stylesheet" href="styles.css?v=tracking-layout-7">
  <link rel="stylesheet" href="mobile-overrides.css?v=dragon-shadow-2">
  <style>.toolbar{position:fixed;top:0;left:0;right:0;z-index:100}.toolbar.toolbar-nav-collapsed{left:auto;right:0;width:52px;padding:12px;background:transparent;box-shadow:none}</style>
</head>
<body>
<div class="falling-leaves" aria-hidden="true"><div class="falling-leaves-side falling-leaves-left"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="falling-leaves-side falling-leaves-right"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<header class="toolbar">
  <div><strong>Local AD&D 2e Sheet</strong><span class="badge">offline</span></div>
  <button id="mobileMenuBtn" class="mobile-menu-btn" type="button" aria-label="Open menu" aria-expanded="false">&#9776;</button>
  <div class="actions">
    <label class="sheet-search">Search sheet<input id="sheetSearch" type="search" placeholder="Search sheet" autocomplete="off"></label><button id="expandAllBtn">Expand all</button><button id="collapseAllBtn">Minimize all</button><button id="topBtn">Go to top</button><button id="notesBtn" type="button">Notes</button><button id="newBtn">New</button><button id="saveBtn" class="primary">Save JSON</button>
    <label class="button">Load JSON<input id="loadInput" type="file" accept="application/json,.json" hidden></label>
    <button id="printBtn">Print</button>
  </div>
  <button id="navPinBtn" class="tooltip-pin toolbar-pin" type="button" aria-label="Hide navigation bar" aria-pressed="false">📌</button>
</header>
<div id="status" role="status">Autosaves locally in this browser.</div>
<main id="app"></main>
<div class="reset-order-wrap"><button id="resetOrderBtn" type="button">Reset card order</button></div>
<footer>Character schema v2. Older imports are migrated; unknown fields are ignored and missing ones receive defaults.<br>WHY ARE YOU READING THIS</footer>
<script src="tracking-calculator.js?v=1"></script>
<script src="app.js?v=goblin-adviser-29"></script>
</body></html>
